status = error
name = EmployeeSparkConsole

# Suppress Spark and Hadoop informational/warning logs for the console demo.
# Errors remain visible; EmployeeAnalysis prints its result table to stdout.
appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss.SSS} %p %c{1}: %m%n%ex
rootLogger.level = error
rootLogger.appenderRef.console.ref = Console
