apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: streaming
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: streaming
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: streaming
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: streaming
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
